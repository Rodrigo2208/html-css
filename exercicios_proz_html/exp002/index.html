<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de IMC</title>
    <link rel="shortcut icon" href="favicon.ico.ico" type="image/x-icon">
</head>

<body>

    <h1>Calculadora de IMC</h1>

    <form onsubmit="pegar_dados_formulario(event)">
        <div>
            <label for="altura">Altura (cm)</label>
            <input required id="altura" type="number" step="0.01" placeholder="Digite sua altura">
        </div>

        <br>

        <div>
            <label for="peso">Peso (kg)</label>
            <input required id="peso" type="number" step="0.01" placeholder="Digite seu peso">
        </div>

        <br>

        <button type="submit">Calcular</button>
    </form>

    <h2>Resultado: <span id="resultado"></span></h2>

    <script src="imc.js"></script>

</body>

</html>
